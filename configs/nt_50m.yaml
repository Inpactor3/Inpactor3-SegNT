model:
  base_model: InstaDeepAI/nucleotide-transformer-v2-50m-multi-species
  freeze_encoder: false        # true → solo entrena cabeza (baseline rápido)
  head_channels: [256, 128]    # capas convolucionales de la cabeza
  num_classes: 2               # 0 = fondo, 1 = LTR-RT
                               # (ampliar a 11+ para superfamilia + linaje)
  dropout: 0.1

data:
  genome: data/raw/TAIR10.fasta
  annotations: data/raw/Inpactor2_predictions.tab
  train_chromosomes: ["1", "2", "3"]
  val_chromosomes:   ["4"]
  test_chromosomes:  ["5"]
  window_size: 6000            # nucleótidos por ventana (~1000 tokens BPE)
  window_stride: 3000          # solape 50%
  cell_size: 100               # granularidad de segmentación final
  min_positive_frac: 0.02      # descarta ventanas positivas con menos del 2%

train:
  epochs: 10
  batch_size: 4                # con NT-50M en GPU T4 free
  gradient_accumulation: 2     # batch efectivo 8
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  pos_weight: 20.0             # ~1:20 desbalance esperado
  early_stopping_patience: 3
  seed: 42

output:
  checkpoint_dir: models/
  log_dir: logs/
  best_metric: val_f1_window
