<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="500" fill="#f8fafc"/>
  <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">
    División por cromosoma — TAIR10 (Arabidopsis)
  </text>
  <text x="600" y="66" text-anchor="middle" font-size="13" fill="#475569">
    Ground truth = Inpactor 2 sobre TAIR10 completo (109 anotaciones)
  </text>

  <!-- Chr1 -->
  <rect x="60" y="130" width="180" height="120" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="150" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Chr1</text>
  <text x="150" y="180" text-anchor="middle" font-size="12" fill="#334155">30 Mb</text>
  <text x="150" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">17</text>
  <text x="150" y="222" text-anchor="middle" font-size="11" fill="#166534">anotaciones</text>
  <text x="150" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">ENTRENAR</text>

  <!-- Chr2 -->
  <rect x="260" y="130" width="180" height="120" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="350" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Chr2</text>
  <text x="350" y="180" text-anchor="middle" font-size="12" fill="#334155">20 Mb</text>
  <text x="350" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">24</text>
  <text x="350" y="222" text-anchor="middle" font-size="11" fill="#166534">anotaciones</text>
  <text x="350" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">ENTRENAR</text>

  <!-- Chr3 -->
  <rect x="460" y="130" width="180" height="120" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="550" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Chr3</text>
  <text x="550" y="180" text-anchor="middle" font-size="12" fill="#334155">23 Mb</text>
  <text x="550" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">24</text>
  <text x="550" y="222" text-anchor="middle" font-size="11" fill="#166534">anotaciones</text>
  <text x="550" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">ENTRENAR</text>

  <!-- Chr4 -->
  <rect x="700" y="130" width="180" height="120" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="790" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">Chr4</text>
  <text x="790" y="180" text-anchor="middle" font-size="12" fill="#334155">19 Mb</text>
  <text x="790" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#78350f">21</text>
  <text x="790" y="222" text-anchor="middle" font-size="11" fill="#92400e">anotaciones</text>
  <text x="790" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">VALIDAR</text>

  <!-- Chr5 -->
  <rect x="940" y="130" width="180" height="120" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <text x="1030" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">Chr5</text>
  <text x="1030" y="180" text-anchor="middle" font-size="12" fill="#334155">27 Mb</text>
  <text x="1030" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#7f1d1d">23</text>
  <text x="1030" y="222" text-anchor="middle" font-size="11" fill="#991b1b">anotaciones</text>
  <text x="1030" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">EXAMEN</text>

  <!-- Totales por bloque -->
  <text x="345" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">
    Total entrenamiento: 65 anotaciones
  </text>
  <text x="790" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">
    Val: 21
  </text>
  <text x="1030" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">
    Test: 23
  </text>

  <!-- Notas -->
  <text x="600" y="345" text-anchor="middle" font-size="13" fill="#334155">
    <tspan font-weight="700">VALIDAR</tspan> se usa para elegir el umbral y decidir cuándo parar el entrenamiento.
  </text>
  <text x="600" y="365" text-anchor="middle" font-size="13" fill="#334155">
    <tspan font-weight="700">EXAMEN</tspan> Chr5 nunca entra al entrenamiento. Es la prueba honesta.
  </text>

  <text x="600" y="410" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">
    Metodología idéntica al informe interno del laboratorio para que los números sean comparables.
  </text>
</svg>
