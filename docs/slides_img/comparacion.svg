<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="500" fill="#f8fafc"/>
  <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">
    Resultado sobre Chr5 — comparación con el informe
  </text>
  <text x="600" y="66" text-anchor="middle" font-size="13" fill="#475569">
    F1 por ventana de 50 kb · 540 ventanas · 21 con LTR-RT
  </text>

  <!-- Eje X -->
  <line x1="120" y1="400" x2="1130" y2="400" stroke="#334155" stroke-width="2"/>

  <!-- Barras: escala 100% = 350 px -->
  <!-- Aleatorio uniforme 5% -->
  <rect x="200" y="382" width="100" height="18" fill="#cbd5e1"/>
  <text x="250" y="425" text-anchor="middle" font-size="12" fill="#334155">Aleatorio</text>
  <text x="250" y="440" text-anchor="middle" font-size="11" fill="#64748b">uniforme</text>
  <text x="250" y="373" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">≈5%</text>

  <!-- Otro transposón 7.5% -->
  <rect x="340" y="374" width="100" height="26" fill="#94a3b8"/>
  <text x="390" y="425" text-anchor="middle" font-size="12" fill="#334155">Otro</text>
  <text x="390" y="440" text-anchor="middle" font-size="11" fill="#64748b">transposón</text>
  <text x="390" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">7.5%</text>

  <!-- SegNT nuestro 8.0% -->
  <rect x="480" y="372" width="100" height="28" fill="#6d28d9" stroke="#4c1d95" stroke-width="2"/>
  <text x="530" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Nuestro</text>
  <text x="530" y="440" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">SegNT</text>
  <text x="530" y="363" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">8.0%</text>

  <!-- Intento 1 informe 19.6% -->
  <rect x="620" y="331" width="100" height="69" fill="#94a3b8"/>
  <text x="670" y="425" text-anchor="middle" font-size="12" fill="#334155">Informe</text>
  <text x="670" y="440" text-anchor="middle" font-size="11" fill="#64748b">intento 1</text>
  <text x="670" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">19.6%</text>

  <!-- Piloto Chr1 22.2% -->
  <rect x="760" y="322" width="100" height="78" fill="#a78bfa"/>
  <text x="810" y="425" text-anchor="middle" font-size="12" fill="#334155">Piloto Chr1</text>
  <text x="810" y="440" text-anchor="middle" font-size="11" fill="#64748b">(pseudo split)</text>
  <text x="810" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">22.2%</text>

  <!-- Baseline informe 26.3% -->
  <rect x="900" y="308" width="100" height="92" fill="#dc2626"/>
  <text x="950" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">Informe</text>
  <text x="950" y="440" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">intento 3 ★</text>
  <text x="950" y="299" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">26.3%</text>

  <!-- Inpactor 2 (ground truth) 100% -->
  <rect x="1040" y="50" width="100" height="350" fill="#1d4ed8"/>
  <text x="1090" y="425" text-anchor="middle" font-size="12" fill="#1e3a8a">Inpactor 2</text>
  <text x="1090" y="440" text-anchor="middle" font-size="11" fill="#1e40af">(la vara)</text>
  <text x="1090" y="41" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">100%</text>

  <!-- Anotación baseline -->
  <line x1="120" y1="308" x2="1000" y2="308" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="130" y="303" font-size="11" font-weight="700" fill="#dc2626">baseline a superar</text>

  <text x="600" y="475" text-anchor="middle" font-size="12" fill="#475569">
    Estamos 18 puntos por debajo del baseline. La brecha es de datos, no de arquitectura.
  </text>
</svg>
