[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inpactor3_segnt"
version = "0.1.0"
description = "Genome Language Model + segmentation head for LTR-RTs"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "transformers==4.44.2",
    "tokenizers==0.19.1",
    "numpy>=1.26",
    "biopython>=1.83",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
